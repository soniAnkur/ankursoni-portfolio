<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A browser tab exposing two named tools to an agent">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1118"/>
      <stop offset="100%" stop-color="#090b11"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58c7e0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6e8bff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" fill="url(#bg2)"/>
  <circle cx="48" cy="176" r="70" fill="#58c7e0" opacity="0.06"/>

  <!-- browser chrome: the tab that is already open -->
  <rect x="22" y="24" width="276" height="152" rx="10" fill="#11151e" stroke="#394257"/>
  <path d="M22 44 h276" stroke="#394257"/>
  <rect x="34" y="30" width="62" height="9" rx="4.5" fill="#2a3040"/>
  <circle cx="110" cy="34.5" r="2.6" fill="#222836"/>

  <!-- the live player inside the page -->
  <circle cx="58" cy="86" r="12" fill="none" stroke="#58c7e0" stroke-width="1.3"/>
  <path d="M54.5 81.5 L64.5 86 L54.5 90.5 Z" fill="#58c7e0"/>
  <rect x="80" y="78" width="78" height="6" rx="3" fill="#2a3040"/>
  <rect x="80" y="92" width="110" height="4" rx="2" fill="#1d2330"/>
  <rect x="80" y="92" width="44" height="4" rx="2" fill="url(#glow2)"/>

  <!-- registered tools -->
  <rect x="40" y="118" width="104" height="24" rx="6" fill="#161b26" stroke="#2a3040"/>
  <text x="54" y="134" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#e2c08d">play_raga</text>

  <rect x="154" y="118" width="104" height="24" rx="6" fill="#161b26" stroke="#2a3040"/>
  <text x="168" y="134" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#e2c08d">set_mood</text>

  <text x="40" y="162" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8b94a6">document.modelContext</text>

  <!-- the agent reaching in -->
  <path d="M276 92 C246 92, 244 120, 262 128" fill="none" stroke="#6e8bff" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="278" cy="92" r="5" fill="#6e8bff"/>
  <path d="M258 124 L264 129 L257 132 Z" fill="#6e8bff"/>
</svg>
